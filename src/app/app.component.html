<nav class="app-navbar">
  <mat-toolbar class="app-toolbar">
    <button
      mat-icon-button
      class="menu-button"
      aria-label="Toggle navigation"
      (click)="drawer.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a class="app-brand" routerLink="/home" aria-label="BDG Angular home">
      <img src="assets/logo.png" alt="" />
      <span class="brand-title">{{ title }}</span>
      <span class="brand-tag">PLAYGROUND</span>
    </a>

    <span class="toolbar-spacer"></span>

    <a
      mat-button
      class="github-link"
      href="https://github.com/blaisedegrille/angular-2023"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the project on GitHub"
    >
      <mat-icon>code</mat-icon>
      <span>GitHub</span>
    </a>
    <ang23-mode-toggle></ang23-mode-toggle>
  </mat-toolbar>
</nav>

<mat-drawer-container class="app-shell" [hasBackdrop]="isMobileViewport">
  <mat-drawer #drawer class="app-drawer" [mode]="drawerMode">
    <div class="drawer-heading">
      <span class="drawer-kicker">WORKSPACE</span>
      <span class="drawer-caption">Explore the demos</span>
    </div>
    <mat-nav-list class="app-nav-list">
      @for (component of componentList; track component.route) {
        <a
          mat-list-item
          [routerLink]="['/', component.route]"
          routerLinkActive="active-nav"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeDrawerOnMobile(drawer)"
        >
          <mat-icon matListItemIcon>{{ component.icon }}</mat-icon>
          <span matListItemTitle>{{ component.name }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="drawer-footer">
      <mat-icon>auto_awesome</mat-icon>
      <span>Angular 21 · Material 3</span>
    </div>
  </mat-drawer>

  <ng-scrollbar track="all" pointerEventsMethod="scrollbar">
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </ng-scrollbar>
</mat-drawer-container>
