<main class="dynamic-grid-page">
  <header class="dynamic-grid-header">
    <div>
      <h1>Dynamic Table</h1>
      <p>Search users by ID, name, or email.</p>
    </div>

    <mat-form-field appearance="outline" class="user-search">
      <mat-label>Search users</mat-label>
      <input
        matInput
        type="search"
        aria-label="Search users by ID, name, or email"
        autocomplete="off"
        [value]="searchTerm"
        (input)="filterUsers($any($event.target).value)"
      />
      @if (searchTerm) {
        <button
          mat-icon-button
          matSuffix
          type="button"
          aria-label="Clear search"
          (click)="searchTerm = ''; filterUsers()"
        >
          <mat-icon>close</mat-icon>
        </button>
      } @else {
        <mat-icon matSuffix>search</mat-icon>
      }
    </mat-form-field>
  </header>

  <ang23-custom-table
    [displayedColumns]="cols"
    [tableData]="tableData"
    [paginationSizes]="paginationSizes"
    [paginationLength]="paginationLength"
    [defaultPageSize]="defaultPageSize"
    [pageIndex]="pageIndex"
    [loading]="loading"
    (pageEvent)="handlePageEvent($event)"
    (sortEvent)="handleSortEvent($event)"
    (editRow)="editUser($event)"
    (deleteRow)="deleteUser($event)"
  >
  </ang23-custom-table>
</main>
